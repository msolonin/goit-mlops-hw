apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-quality-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/msolonin/goit-mlops-hw"
    targetRevision: final-project"
    path: helm
  destination:
    server: "https://kubernetes.default.svc"
    namespace: aiops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
