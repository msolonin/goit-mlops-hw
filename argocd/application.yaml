apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-quality-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://gitlab.com/msolonin/mlops-goit-hw"
    targetRevision: main
    path: helm
  destination:
    server: "https://kubernetes.default.svc"
    namespace: aiops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
