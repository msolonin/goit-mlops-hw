apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    targetRevision: 0.6.2
    helm:
      values: |
        image:
          repository: docker.io/msolonin/mlflow
          tag: psycopg21

        service:
          type: ClusterIP
          port: 5000
          containerPort: 5000

        backendStore:
          postgres:
            enabled: true
            host: postgres-postgresql.mlflow.svc.cluster.local
            port: 5432
            database: mlflow
            user: mlflow
            password: mlflowpass
            driver: psycopg2

        artifactRoot:
          s3:
            enabled: true
            bucket: mlflow-artifacts
            accessKey: minio
            secretKey: minio123
            endpointUrl: http://minio.mlflow.svc.cluster.local:9000

        # підключаємо секрет mlflow-secrets
        extraEnvFrom:
          - secretRef:
              name: mlflow-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
