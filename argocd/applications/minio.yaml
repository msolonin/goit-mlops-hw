apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 12.5.1
    chart: minio
    helm:
      parameters:
        - name: defaultBuckets
          value: "mlflow-artifacts"
  syncPolicy:
    automated: {}
