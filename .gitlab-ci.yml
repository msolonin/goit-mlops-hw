stages:
  - train
  - build
  - deploy

retrain-model:
  stage: train
  script:
    - python model/train.py
    - docker build -t registry.example.com/aiops-quality-project:$CI_COMMIT_SHORT_SHA .
    - docker push registry.example.com/aiops-quality-project:$CI_COMMIT_SHORT_SHA
  artifacts:
    paths:
      - model/model.pkl
  only:
    - triggers

deploy:
  stage: deploy
  script:
    - helm upgrade --install aiops helm/ --namespace aiops --values helm/values.yaml --values helm/values-secrets.example.yaml --set image.tag=$CI_COMMIT_SHORT_SHA
