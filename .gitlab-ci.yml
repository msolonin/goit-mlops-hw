stages:
  - train
  - build
  - deploy

variables:
  DOCKER_IMAGE: 020236748758.dkr.ecr.us-east-1.amazonaws.com/aiops-quality-project

retrain-model:
  stage: train
  image: docker:latest
  services:
    - docker:dind
  script:
    - apk add --no-cache python3 py3-pip
    - pip install -r requirements.txt
    - python model/train.py
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
  artifacts:
    paths:
      - model/model.pkl
  only:
    - triggers

deploy:
  stage: deploy
  image: alpine/helm:3.12.0
  script:
    - helm repo update
    - helm upgrade --install aiops helm/ \
      --namespace aiops \
      --values helm/values.yaml \
      --values helm/values-secrets.example.yaml \
      --set image.tag=$CI_COMMIT_SHORT_SHA
  only:
    - triggers
