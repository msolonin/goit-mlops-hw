image: python:3.11-slim

stages:
  - train

train-model:
  stage: train
  script:
    - pip install --upgrade awscli
    - aws --version
    - echo "Starting Step Function execution..."
    - aws stepfunctions start-execution --state-machine-arn "$STATE_MACHINE_ARN" --name "train-${CI_COMMIT_SHORT_SHA}-$(date +%s)" --input '{"source":"gitlab-ci","commit":"'"$CI_COMMIT_SHORT_SHA"'"}'
  rules:
    - if: "$CI_COMMIT_BRANCH"
