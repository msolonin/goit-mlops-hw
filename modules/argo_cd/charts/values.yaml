applications:
  - name: example-app
    namespace: default
    project: default
    source:
      repoURL: "https://github.com/msolonin/goit-mlops-hw"
      path: helm
      targetRevision: "final-project"
      helm:
        valueFiles:
          - values.yaml
    destination:
      server: https://kubernetes.default.svc
      namespace: default
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
