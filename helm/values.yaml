# Default values for exampleapp
replicaCount: 1

image:
  repository: registry.gitlab.com/msolonin/mlops-goit-hw/aiops-quality-project
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: gitlab-registry

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

# Simple pod-level configuration
podAnnotations: {}
podLabels: {}

# Basic container configuration
containerPort: 8000

# Environment variables
env:
  # Common environment variables
  common:
    HOST: "0.0.0.0"
    PORT: "8000"
    LOG_LEVEL: "INFO"

  # Model-specific environment variables
  model:
    MODEL_NAME: "exammple model Linear Regression"
    MODEL_VERSION: "1.1.0"
    MODEL_PATH: "app/model/model.pkl"

  # Additional environment variables (optional)
  extra: {}

# Secret environment variables (optional)
envSecrets: {}

# ConfigMap environment variables (optional)
envConfigMaps: {}

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

  - name: kube-prometheus-stack
    namespace: argocd
    project: default
    source:
      repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 45.5.0
      helm:
        values: |
          namespaceOverride: monitoring
          prometheus:
            service:
              type: ClusterIP
            prometheusSpec:
              replicas: 1
              retention: 10d
              serviceMonitorSelectorNilUsesHelmValues: false
              serviceMonitorSelector:
                matchLabels:
                  release: monitoring
          grafana:
            enabled: true
            service:
              type: ClusterIP
            adminPassword: admin
            defaultDashboardsEnabled: true
          alertmanager:
            enabled: true
            service:
              type: ClusterIP
            alertmanagerSpec:
              replicas: 1
          pushgateway:
            enabled: true
            service:
              type: ClusterIP
            serviceMonitor:
              enabled: true
              interval: 15s
              labels:
                release: monitoring
    destination:
      server: https://kubernetes.default.svc
      namespace: monitoring
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true